stages:
  - install
  - audit
  - build
  - test
  - sast
  - deploy

variables:
  MYSQL_ROOT_PASSWORD: rootpassword
  MYSQL_DATABASE: ecommerce
  MYSQL_USER: appuser
  MYSQL_PASSWORD: apppassword
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: ecommerce
  DB_USER: appuser
  DB_PASSWORD: apppassword
  REDIS_HOST: redis
  REDIS_PORT: "6379"

install:
  stage: install
  image: node:22-alpine
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

audit:
  stage: audit
  image: node:22-alpine
  needs: [install]
  script:
    - npm audit --audit-level=high

build:
  stage: build
  image: node:22-alpine
  needs: [install]
  script:
    - npm run build
    - npm prune --omit=dev
    - node dist/main.js &
    - sleep 3
    - kill %1 || true
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

unit-test:
  stage: test
  image: node:22-alpine
  needs: [install]
  script:
    - npm run run-unit-test
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

integration-test:
  stage: test
  image: node:22-alpine
  needs: [install, build]
  services:
    - name: mysql:8.0
      alias: mysql
    - name: redis:7-alpine
      alias: redis
  script:
    - npm run db:migrate
    - npm run start &
    - sleep 5
    - npm run run-integration-test

sast:
  stage: sast
  image: node:22-alpine
  needs: [install]
  script:
    - npx eslint "src/**/*.ts" --max-warnings=0

deploy:
  stage: deploy
  image: node:22-alpine
  needs: [unit-test, integration-test, sast]
  only:
    - main
  script:
    - npx semantic-release --dry-run
