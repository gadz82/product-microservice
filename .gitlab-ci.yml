stages:
  - install
  - audit
  - build
  - test
  - sast
  - deploy

variables:
  MYSQL_ROOT_PASSWORD: rootpassword
  MYSQL_DATABASE: ecommerce
  MYSQL_USER: appuser
  MYSQL_PASSWORD: apppassword
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: ecommerce
  DB_USER: appuser
  DB_PASSWORD: apppassword

install:
  stage: install
  image: node:22-alpine
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

audit:
  stage: audit
  image: node:22-alpine
  needs: [install]
  script:
    - npm install -g npm@latest
    - npm audit --audit-level=critical

build:
  stage: build
  image: node:22-alpine
  needs: [install]
  script:
    - cp -r node_modules node_modules_backup
    - npm run build
    - npm prune --omit=dev
    - node -e "require('./dist/app.module')"
    - rm -rf node_modules
    - mv node_modules_backup node_modules
    - rm -rf node_modules
    - mv node_modules_backup node_modules
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

unit-test:
  stage: test
  image: node:22-alpine
  needs: [install]
  script:
    - LOGGER_LEVEL=SILENT npm run unit-test
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

integration-test:
  stage: test
  image: node:22-alpine
  needs: [install, build]
  services:
    - name: mysql:8.0
      alias: mysql
  script:
    - npm run db:migrate
    - npm run start &
    - LOGGER_LEVEL=SILENT ./scripts/wait-for-health.sh localhost 3000 30
    - npm run integration-test:all

sast:
  stage: sast
  image: node:22-alpine
  needs: [install]
  script:
    - npx eslint "src/**/*.ts" --max-warnings=0

deploy:
  stage: deploy
  image: node:22
  needs: [install, unit-test, integration-test, sast]
  only:
    - main
  script:
    - ./node_modules/.bin/semantic-release --dry-run
