<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1080" style="font-family: Menlo, Monaco, Consolas, monospace; font-size: 13px;">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="err" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="ok" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#3498db"/>
    </linearGradient>
    <linearGradient id="hdr-r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7b241c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
  </defs>

  <rect width="960" height="1080" fill="#f8f9fa" rx="4"/>

  <!-- ================================================================ -->
  <!-- LEFT COLUMN: REQUEST PATH                                        -->
  <!-- ================================================================ -->

  <rect x="0" y="0" width="450" height="44" fill="url(#hdr)"/>
  <text x="225" y="28" text-anchor="middle" fill="white" font-size="15" font-weight="bold">POST /v1/products — Request</text>

  <!-- Client -->
  <rect x="30" y="70" width="190" height="48" rx="6" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="125" y="92" text-anchor="middle" fill="#2c3e50" font-weight="bold">Client</text>
  <text x="125" y="108" text-anchor="middle" fill="#7f8c8d" font-size="11">{ name, productToken, price, stock }</text>

  <line x1="220" y1="94" x2="265" y2="94" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Bootstrap -->
  <rect x="30" y="148" width="260" height="48" rx="6" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="160" y="170" text-anchor="middle" fill="#e6a100" font-size="12" font-weight="bold">main.ts — Bootstrap</text>
  <text x="160" y="186" text-anchor="middle" fill="#856404" font-size="10">Global filters, pipes, URI versioning (v1)</text>

  <line x1="160" y1="196" x2="160" y2="228" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ValidationPipe -->
  <rect x="30" y="232" width="260" height="56" rx="6" fill="#e8f4fd" stroke="#3498db" stroke-width="1.5"/>
  <text x="160" y="252" text-anchor="middle" fill="#2980b9" font-size="12" font-weight="bold">ValidationPipe</text>
  <text x="160" y="268" text-anchor="middle" fill="#1a5276" font-size="10">whitelist • forbidNonWhitelisted</text>
  <text x="160" y="282" text-anchor="middle" fill="#1a5276" font-size="10">transform • stopAtFirstError</text>

  <!-- 400 error from Pipe -->
  <line x1="30" y1="260" x2="10" y2="260" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#err)"/>
  <circle cx="6" cy="260" r="9" fill="#c0392b"/>
  <text x="6" y="264" text-anchor="middle" fill="white" font-size="7" font-weight="bold">400</text>

  <line x1="160" y1="288" x2="160" y2="322" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Controller -->
  <rect x="30" y="326" width="260" height="52" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="160" y="346" text-anchor="middle" fill="#1e8449" font-size="12" font-weight="bold">ProductsController</text>
  <text x="160" y="362" text-anchor="middle" fill="#196f3d" font-size="10">@Post() @HttpCode(201) create(dto)</text>
  <text x="160" y="374" text-anchor="middle" fill="#196f3d" font-size="10">→ writeService.create()</text>

  <line x1="160" y1="378" x2="160" y2="412" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- WriteService -->
  <rect x="30" y="416" width="260" height="68" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="160" y="436" text-anchor="middle" fill="#1e8449" font-size="12" font-weight="bold">ProductWriteService</text>
  <text x="160" y="454" text-anchor="middle" fill="#196f3d" font-size="10">1. findByToken(token) → exists? throw 409</text>
  <text x="160" y="470" text-anchor="middle" fill="#196f3d" font-size="10">2. productsRepository.create(dto)</text>
  <text x="160" y="486" text-anchor="middle" fill="#196f3d" font-size="10">3. logger.log(...)</text>

  <!-- 409 error from Service -->
  <line x1="30" y1="450" x2="10" y2="450" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#err)"/>
  <circle cx="6" cy="450" r="9" fill="#c0392b"/>
  <text x="6" y="454" text-anchor="middle" fill="white" font-size="7" font-weight="bold">409</text>

  <line x1="160" y1="484" x2="160" y2="518" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Repository -->
  <rect x="30" y="522" width="260" height="46" rx="6" fill="#e8daef" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="160" y="542" text-anchor="middle" fill="#6c3483" font-size="12" font-weight="bold">ProductsRepository</text>
  <text x="160" y="558" text-anchor="middle" fill="#4a235a" font-size="10">findByToken / create (Sequelize wrapper)</text>

  <line x1="160" y1="568" x2="160" y2="602" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Model -->
  <rect x="30" y="606" width="260" height="40" rx="6" fill="#e8daef" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="160" y="624" text-anchor="middle" fill="#6c3483" font-size="12" font-weight="bold">Product Model</text>
  <text x="160" y="640" text-anchor="middle" fill="#4a235a" font-size="10">SequelizeModel.create({...dto})</text>

  <line x1="160" y1="646" x2="160" y2="678" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- MySQL -->
  <rect x="30" y="682" width="260" height="55" rx="6" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="160" y="702" text-anchor="middle" fill="#c0392b" font-size="12" font-weight="bold">MySQL 8.0</text>
  <text x="160" y="718" text-anchor="middle" fill="#922b21" font-size="10">DECIMAL(10,2) — exact pricing</text>
  <text x="160" y="732" text-anchor="middle" fill="#922b21" font-size="10">UNIQUE(productToken)</text>

  <!-- Return path arrows on right side of left column -->
  <!-- MySQL → Model -->
  <line x1="290" y1="710" x2="330" y2="710" stroke="#27ae60" stroke-width="1.5" marker-end="url(#ok)"/>
  <!-- Model → Repository -->
  <line x1="330" y1="626" x2="330" y2="545" stroke="#27ae60" stroke-width="1.5" marker-end="url(#ok)"/>
  <!-- Repository → WriteService -->
  <line x1="330" y1="545" x2="330" y2="450" stroke="#27ae60" stroke-width="1.5" marker-end="url(#ok)"/>
  <!-- WriteService → Controller -->
  <line x1="330" y1="450" x2="330" y2="352" stroke="#27ae60" stroke-width="1.5" marker-end="url(#ok)"/>

  <!-- Controller → Serializer -->
  <line x1="290" y1="352" x2="470" y2="130" stroke="#27ae60" stroke-width="1.5" marker-end="url(#ok)"/>
  <text x="395" y="238" fill="#7f8c8d" font-size="9" transform="rotate(-35 395 238)">Product object</text>

  <!-- ================================================================ -->
  <!-- RIGHT COLUMN: RESPONSE PATH                                      -->
  <!-- ================================================================ -->

  <rect x="480" y="0" width="480" height="44" fill="url(#hdr)"/>
  <text x="720" y="28" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Response — JSON:API</text>

  <!-- Serializer -->
  <rect x="500" y="82" width="430" height="90" rx="6" fill="#fdebd0" stroke="#f39c12" stroke-width="1.5"/>
  <text x="715" y="104" text-anchor="middle" fill="#b9770e" font-size="12" font-weight="bold">ProductsSerializer → JsonApiSerializer</text>
  <text x="715" y="122" text-anchor="middle" fill="#7d6608" font-size="10">• serializeOne('products', productToken, attributes)</text>
  <text x="715" y="138" text-anchor="middle" fill="#7d6608" font-size="10">• plainToInstance(ProductResponseDto) applies @Exclude / @Expose</text>
  <text x="715" y="154" text-anchor="middle" fill="#7d6608" font-size="10">• @Exclude id  •  @Expose productToken (duplicated in attributes)</text>
  <text x="715" y="168" text-anchor="middle" fill="#555" font-size="9">Two-layer design: generic JsonApiSerializer + domain ProductsSerializer</text>

  <!-- Resolver → Response -->
  <line x1="500" y1="127" x2="480" y2="127" stroke="#27ae60" stroke-width="1.5" marker-end="url(#ok)"/>

  <!-- Serializer → Response Box -->
  <line x1="715" y1="172" x2="715" y2="218" stroke="#27ae60" stroke-width="1.5" marker-end="url(#ok)"/>

  <!-- Response Box -->
  <rect x="500" y="222" width="430" height="78" rx="6" fill="#d4efdf" stroke="#1e8449" stroke-width="1.5"/>
  <text x="715" y="244" text-anchor="middle" fill="#1e8449" font-size="13" font-weight="bold">HTTP 201 Created</text>
  <text x="715" y="266" text-anchor="middle" fill="#196f3d" font-size="10">{</text>
  <text x="715" y="282" text-anchor="middle" fill="#196f3d" font-size="10">  data: { type: "products", id: "iphone-15",</text>
  <text x="715" y="296" text-anchor="middle" fill="#196f3d" font-size="10">    attributes: { name, productToken, price: "999.99", stock, ... }   }</text>

  <!-- Response → Client -->
  <line x1="500" y1="261" x2="470" y2="261" stroke="#27ae60" stroke-width="1.5" marker-end="url(#ok)"/>

  <!-- ================================================================ -->
  <!-- ERROR HANDLING SECTION                                           -->
  <!-- ================================================================ -->

  <rect x="30" y="790" width="900" height="28" rx="6" fill="url(#hdr-r)"/>
  <text x="480" y="808" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Error Handling — Two Exception Filters</text>

  <rect x="30" y="818" width="900" height="80" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1"/>

  <rect x="45" y="830" width="280" height="56" rx="4" fill="#fff" stroke="#ddd" stroke-width="0.5"/>
  <text x="185" y="850" text-anchor="middle" fill="#e67e22" font-size="10" font-weight="bold">ValidationPipe + HttpExceptionFilter</text>
  <text x="185" y="866" text-anchor="middle" fill="#555" font-size="9">Missing fields / wrong types / negative values</text>
  <text x="185" y="880" text-anchor="middle" fill="#c0392b" font-size="10" font-weight="bold">→ 400 Bad Request</text>

  <rect x="340" y="830" width="280" height="56" rx="4" fill="#fff" stroke="#ddd" stroke-width="0.5"/>
  <text x="480" y="850" text-anchor="middle" fill="#e67e22" font-size="10" font-weight="bold">ProductWriteService</text>
  <text x="480" y="866" text-anchor="middle" fill="#555" font-size="9">findByToken returns null (not found)</text>
  <text x="480" y="880" text-anchor="middle" fill="#c0392b" font-size="10" font-weight="bold">→ 404 Not Found</text>

  <rect x="635" y="830" width="280" height="56" rx="4" fill="#fff" stroke="#ddd" stroke-width="0.5"/>
  <text x="775" y="850" text-anchor="middle" fill="#e67e22" font-size="10" font-weight="bold">DatabaseExceptionFilter</text>
  <text x="775" y="866" text-anchor="middle" fill="#555" font-size="9">UniqueConstraintError → 409  |  ConnectionError → 503</text>
  <text x="775" y="880" text-anchor="middle" fill="#c0392b" font-size="10" font-weight="bold">Unknown → 500 Internal Server Error</text>

  <!-- Prod vs Dev -->
  <rect x="30" y="910" width="900" height="52" rx="4" fill="#fff" stroke="#ddd" stroke-width="0.5"/>
  <text x="480" y="930" text-anchor="middle" fill="#2c3e50" font-size="11" font-weight="bold">Production vs Development Mode</text>
  <text x="480" y="948" text-anchor="middle" fill="#555" font-size="10">Dev:  detailed validation messages (disableErrorMessages: false, stopAtFirstError)</text>
  <text x="480" y="960" text-anchor="middle" fill="#555" font-size="10">Prod: only HTTP status label returned (disableErrorMessages: true) — no internal details leaked</text>

  <!-- ================================================================ -->
  <!-- ARCHITECTURE SUMMARY                                             -->
  <!-- ================================================================ -->

  <rect x="30" y="990" width="900" height="28" rx="6" fill="url(#hdr)"/>
  <text x="480" y="1008" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Layered Architecture — Why This Structure?</text>

  <!-- Layer boxes -->
  <rect x="30" y="1026" width="205" height="66" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="133" y="1046" text-anchor="middle" fill="#1e8449" font-size="10" font-weight="bold">Controller</text>
  <text x="133" y="1062" text-anchor="middle" fill="#196f3d" font-size="9">HTTP contract only</text>
  <text x="133" y="1076" text-anchor="middle" fill="#196f3d" font-size="9">No business logic</text>

  <rect x="250" y="1026" width="205" height="66" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="353" y="1046" text-anchor="middle" fill="#1e8449" font-size="10" font-weight="bold">Service (CQS-lite)</text>
  <text x="353" y="1062" text-anchor="middle" fill="#196f3d" font-size="9">Business rules only</text>
  <text x="353" y="1076" text-anchor="middle" fill="#196f3d" font-size="9">ReadService / WriteService</text>

  <rect x="470" y="1026" width="205" height="66" rx="4" fill="#e8daef" stroke="#8e44ad" stroke-width="1"/>
  <text x="573" y="1046" text-anchor="middle" fill="#6c3483" font-size="10" font-weight="bold">Repository</text>
  <text x="573" y="1062" text-anchor="middle" fill="#4a235a" font-size="9">Data access only</text>
  <text x="573" y="1076" text-anchor="middle" fill="#4a235a" font-size="9">ORM swap without service changes</text>

  <rect x="690" y="1026" width="240" height="66" rx="4" fill="#fdebd0" stroke="#f39c12" stroke-width="1"/>
  <text x="810" y="1046" text-anchor="middle" fill="#b9770e" font-size="10" font-weight="bold">Serializer</text>
  <text x="810" y="1062" text-anchor="middle" fill="#7d6608" font-size="9">JSON:API formatting</text>
  <text x="810" y="1076" text-anchor="middle" fill="#7d6608" font-size="9">Reusable across all modules</text>

</svg>
